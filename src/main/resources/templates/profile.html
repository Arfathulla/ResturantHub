<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('My Profile', ~{::#content})}">
<head><title>My Profile</title></head>
<body>
<div id="content">
    <div class="container py-5">
        <div class="row g-4">
            <!-- Profile Info Card -->
            <div class="col-md-7">
                <div class="card shadow-sm p-4">
                    <h4 class="fw-bold mb-3"><i class="fa-solid fa-user-gear text-warning me-2"></i> Account Details</h4>
                    <form th:action="@{/profile}" th:object="${profile}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Email Address</label>
                            <input type="text" class="form-control bg-light" th:field="*{email}" readonly>
                            <div class="form-text small">Email cannot be changed directly for security audit reasons.</div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">First Name</label>
                                <input type="text" th:field="*{firstName}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Last Name</label>
                                <input type="text" th:field="*{lastName}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Phone Number</label>
                            <input type="text" th:field="*{phoneNumber}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Assigned Roles</label>
                            <div>
                                <span class="badge bg-dark me-1" th:each="r : ${profile.roles}" th:text="${r}">ROLE_CUSTOMER</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning fw-bold px-4 shadow-sm">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
                        </button>
                    </form>
                </div>
            </div>

            <!-- Change Password Card -->
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <h4 class="fw-bold mb-3"><i class="fa-solid fa-shield-halved text-danger me-2"></i> Change Password</h4>
                    <form th:action="@{/profile/change-password}" th:object="${changePasswordDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Current Password</label>
                            <input type="password" th:field="*{currentPassword}" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">New Password</label>
                            <input type="password" th:field="*{newPassword}" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-outline-danger fw-bold w-100">
                            <i class="fa-solid fa-key me-1"></i> Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
