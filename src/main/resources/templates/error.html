<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantHub — Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container text-center py-5">
        <div class="card shadow-sm mx-auto p-4" style="max-width: 550px;">
            <div class="text-danger mb-3">
                <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
            </div>
            <h2 class="card-title text-dark fw-bold" th:text="${error != null ? error : 'Something went wrong'}">Application Error</h2>
            <p class="text-muted mt-2" th:text="${message != null ? message : 'An unexpected error occurred while processing your request.'}"></p>
            <div class="alert alert-secondary py-2 small" th:if="${correlationId}">
                Reference ID: <code th:text="${correlationId}">12345</code>
            </div>
            <div class="mt-4">
                <a href="/" class="btn btn-primary px-4 me-2"><i class="fa-solid fa-house me-1"></i> Return Home</a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-3">Go Back</a>
            </div>
        </div>
    </div>
</body>
</html>
