<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Create Account', ~{::#content})}">
<head><title>Create Account</title></head>
<body>
<div id="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-plus text-warning fa-3x mb-2"></i>
                        <h3 class="fw-bold">Join RestaurantHub</h3>
                        <p class="text-muted small">Create an account to book tables, order meals, and earn rewards</p>
                    </div>

                    <form th:action="@{/register}" th:object="${registerDto}" method="post">
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">First Name</label>
                                <input type="text" th:field="*{firstName}" class="form-control" placeholder="First Name" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Last Name</label>
                                <input type="text" th:field="*{lastName}" class="form-control" placeholder="Last Name" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Phone Number (Optional)</label>
                            <input type="tel" th:field="*{phoneNumber}" class="form-control" placeholder="+12025550199">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Min 8 chars, 1 uppercase, 1 digit, 1 special symbol" required>
                            <div class="form-text small text-muted">Must contain uppercase, lowercase, number, and special character.</div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-2 shadow-sm">
                            <i class="fa-solid fa-check me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="small text-muted mb-0">Already registered? <a href="/login" class="fw-semibold text-warning text-dark">Log In here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
