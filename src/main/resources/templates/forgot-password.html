<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Forgot Password', ~{::#content})}">
<head><title>Forgot Password</title></head>
<body>
<div id="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-key text-warning fa-3x mb-2"></i>
                        <h3 class="fw-bold">Password Recovery</h3>
                        <p class="text-muted small">Enter your email address to receive password reset instructions</p>
                    </div>

                    <div th:if="${resetTokenNotice}" class="alert alert-warning small">
                        <i class="fa-solid fa-info-circle me-1"></i> <span th:text="${resetTokenNotice}"></span>
                        <div class="mt-2">
                            <a th:href="@{/reset-password}" class="btn btn-sm btn-dark">Go to Reset Password Page</a>
                        </div>
                    </div>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Registered Email</label>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm">
                            <i class="fa-solid fa-paper-plane me-1"></i> Request Reset Token
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/login" class="small text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
