<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Reset Password', ~{::#content})}">
<head><title>Reset Password</title></head>
<body>
<div id="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-lock-open text-warning fa-3x mb-2"></i>
                        <h3 class="fw-bold">Set New Password</h3>
                        <p class="text-muted small">Enter the reset token along with your new password</p>
                    </div>

                    <form th:action="@{/reset-password}" th:object="${resetDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Reset Token</label>
                            <input type="text" th:field="*{token}" class="form-control" placeholder="Enter token from email or demo" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('token')}" th:errors="*{token}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">New Password</label>
                            <input type="password" th:field="*{newPassword}" class="form-control" placeholder="New Password" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm">
                            <i class="fa-solid fa-check me-1"></i> Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
