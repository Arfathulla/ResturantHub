<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Kitchen Queue', ~{::#content})}">
<head><title>Kitchen Live Queue</title></head>
<body>
<div id="content">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="fa-solid fa-fire-burner text-danger me-2"></i> Kitchen Live Order Queue</h2>
                <p class="text-muted mb-0">Live order intake, preparation station, and kitchen fulfillment workflow</p>
            </div>
            <form th:action="@{/kitchen/queue}" method="get" class="d-flex align-items-center gap-2">
                <label class="small fw-semibold text-muted mb-0">Branch:</label>
                <select name="branchId" class="form-select form-select-sm" onchange="this.form.submit()">
                    <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == selectedBranchId}"></option>
                </select>
            </form>
        </div>

        <div class="row g-4" th:if="${not #lists.isEmpty(liveOrders)}">
            <div class="col-md-6 col-lg-4" th:each="o : ${liveOrders}">
                <div class="card shadow-sm h-100 border-top border-4"
                     th:classappend="${o.status == 'PLACED'} ? 'border-danger' : (${o.status == 'ACCEPTED'} ? 'border-primary' : (${o.status == 'PREPARING'} ? 'border-warning' : 'border-success'))">
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold fs-5 text-dark" th:text="${o.orderNumber}">ORD-1234</span>
                            <span class="badge"
                                  th:classappend="${o.status == 'PLACED'} ? 'bg-danger' : (${o.status == 'ACCEPTED'} ? 'bg-primary' : (${o.status == 'PREPARING'} ? 'bg-warning text-dark' : 'bg-success'))"
                                  th:text="${o.status}">PLACED</span>
                        </div>

                        <div class="mb-3">
                            <span class="badge bg-secondary me-1" th:text="${o.orderType}">DINE_IN</span>
                            <small class="text-muted" th:text="${#temporals.format(o.createdAt, 'HH:mm')}">19:30</small>
                            <span class="text-muted small d-block mt-1" th:if="${o.tableReservationId != null}">Linked Table Booking #<span th:text="${o.tableReservationId}">1</span></span>
                        </div>

                        <!-- Dishes List -->
                        <ul class="list-group list-group-flush mb-3 flex-grow-1">
                            <li class="list-group-item px-0" th:each="i : ${o.items}">
                                <div class="d-flex justify-content-between">
                                    <span class="fw-bold"><span class="badge bg-dark me-1" th:text="${i.quantity}">1</span> <span th:text="${i.itemName}">Risotto</span></span>
                                </div>
                                <div class="text-muted small" th:each="a : ${i.addonNames}" th:text="${'+ ' + a}">+ Extra Truffle</div>
                                <div class="small text-danger fst-italic" th:if="${i.specialInstructions != null and !i.specialInstructions.isBlank()}" th:text="${'Note: ' + i.specialInstructions}"></div>
                            </li>
                        </ul>

                        <!-- Kitchen Workflow Progression Buttons -->
                        <div class="mt-auto pt-3 border-top">
                            <div th:if="${o.status == 'PLACED'}">
                                <form th:action="@{'/kitchen/orders/' + ${o.orderNumber} + '/status'}" method="post">
                                    <input type="hidden" name="newStatus" value="ACCEPTED">
                                    <input type="hidden" name="branchId" th:value="${selectedBranchId}">
                                    <button type="submit" class="btn btn-primary w-100 fw-bold">
                                        <i class="fa-solid fa-check me-1"></i> Accept Order
                                    </button>
                                </form>
                            </div>

                            <div th:if="${o.status == 'ACCEPTED'}">
                                <form th:action="@{'/kitchen/orders/' + ${o.orderNumber} + '/status'}" method="post">
                                    <input type="hidden" name="newStatus" value="PREPARING">
                                    <input type="hidden" name="branchId" th:value="${selectedBranchId}">
                                    <button type="submit" class="btn btn-warning w-100 fw-bold">
                                        <i class="fa-solid fa-fire-burner me-1"></i> Start Preparing
                                    </button>
                                </form>
                            </div>

                            <div th:if="${o.status == 'PREPARING'}">
                                <form th:action="@{'/kitchen/orders/' + ${o.orderNumber} + '/status'}" method="post">
                                    <input type="hidden" name="newStatus" value="READY_FOR_PICKUP">
                                    <input type="hidden" name="branchId" th:value="${selectedBranchId}">
                                    <button type="submit" class="btn btn-success w-100 fw-bold">
                                        <i class="fa-solid fa-bell-concierge me-1"></i> Mark Ready for Pickup
                                    </button>
                                </form>
                            </div>

                            <div th:if="${o.status == 'READY_FOR_PICKUP'}">
                                <form th:action="@{'/kitchen/orders/' + ${o.orderNumber} + '/status'}" method="post">
                                    <input type="hidden" name="newStatus" value="COMPLETED">
                                    <input type="hidden" name="branchId" th:value="${selectedBranchId}">
                                    <button type="submit" class="btn btn-dark w-100 fw-bold">
                                        <i class="fa-solid fa-circle-check me-1"></i> Complete & Serve
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(liveOrders)}" class="text-center py-5 bg-white rounded border shadow-sm">
            <i class="fa-solid fa-kitchen-set text-muted fa-4x mb-3"></i>
            <h4>All Caught Up!</h4>
            <p class="text-muted mb-0">No active food orders currently in queue for this branch.</p>
        </div>
    </div>
</div>
</body>
</html>
