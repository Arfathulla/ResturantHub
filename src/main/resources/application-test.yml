spring:
  datasource:
    url: jdbc:h2:mem:restauranthub_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false # JPA ddl-auto creates schema directly for fast test execution

logging:
  level:
    com.restauranthub: INFO
